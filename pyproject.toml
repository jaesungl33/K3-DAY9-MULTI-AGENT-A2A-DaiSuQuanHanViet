[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-multi-agent-dispute-resolution"
version = "1.0.0"
description = "Deterministic multi-agent resolver for the Olist Day 9 A2A lab"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
